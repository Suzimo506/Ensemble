name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build MDEN.Protocol
        run: dotnet build MDEN.Protocol/MDEN.Protocol.csproj -c Release --no-restore


      - name: Download game assets (optional)
        if: ${{ secrets.GAME_ASSETS_URL != '' }}
        run: |
          curl -L -o game-assets.zip "${{ secrets.GAME_ASSETS_URL }}"
          mkdir -p musedash
          unzip -q game-assets.zip -d musedash
          echo "MD_NET6_DIRECTORY=$(pwd)/musedash" >> "$GITHUB_ENV"

      - name: Build full mod
        if: ${{ env.MD_NET6_DIRECTORY != '' }}
        run: dotnet build MDEN.csproj -c Release -p:CopyToMuseDash=false

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp MDEN.Protocol/bin/Release/net6.0/MDEN.Protocol.dll release/

          if [ -f bin/Release/net6.0/Ensemble.dll ]; then
            cp bin/Release/net6.0/Ensemble.dll release/
            echo "Mod built: full release (Ensemble.dll + MDEN.Protocol.dll)" > release/BUILD_INFO.txt
          else
            echo "Mod NOT built: game assets not configured (GAME_ASSETS_URL secret missing)" > release/BUILD_INFO.txt
            echo "Only MDEN.Protocol.dll is included in this release." >> release/BUILD_INFO.txt
            echo "" >> release/BUILD_INFO.txt
            echo "To build the full mod, set the GAME_ASSETS_URL secret to a zip URL" >> release/BUILD_INFO.txt
            echo "containing the Muse Dash MelonLoader/ and Mods/ directories." >> release/BUILD_INFO.txt
          fi

      - name: Zip release
        run: |
          cd release
          zip -r Ensemble-${{ steps.version.outputs.version }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Ensemble-${{ steps.version.outputs.version }}.zip
          name: Ensemble ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
